name: Trading Agent Scheduler

"on":
  schedule:
    # Run every 2 hours, 24/7. Agent decides mode based on time of day.
    - cron: "0 */2 * * *"
  
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Run mode"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - full
          - alerts-only
          - research

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT_TOKEN }}
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - run: pip install -r requirements.txt

    - name: Determine run mode
      id: mode
      run: |
        MANUAL_MODE="${{ github.event.inputs.run_mode }}"
        if [ "$MANUAL_MODE" = "full" ]; then echo "MODE=full" >> $GITHUB_OUTPUT; exit 0
        elif [ "$MANUAL_MODE" = "alerts-only" ]; then echo "MODE=alerts-only" >> $GITHUB_OUTPUT; exit 0
        elif [ "$MANUAL_MODE" = "research" ]; then echo "MODE=research" >> $GITHUB_OUTPUT; exit 0
        fi
        HOUR=$(TZ='US/Eastern' date +%H)
        DOW=$(TZ='US/Eastern' date +%u)
        # Full reports: 8 AM, 12 PM, 4 PM
        if [ "$HOUR" -eq 8 ] || [ "$HOUR" -eq 12 ] || [ "$HOUR" -eq 16 ]; then
          echo "MODE=full" >> $GITHUB_OUTPUT
        # Market hours Mon-Fri: alerts-only
        elif [ "$DOW" -le 5 ] && [ "$HOUR" -ge 9 ] && [ "$HOUR" -lt 16 ]; then
          echo "MODE=alerts-only" >> $GITHUB_OUTPUT
        # Everything else: research mode
        else
          echo "MODE=research" >> $GITHUB_OUTPUT
        fi

    - name: Run agent (full)
      if: steps.mode.outputs.MODE == 'full'
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
        ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        CLICKUP_API_KEY: ${{ secrets.CLICKUP_API_KEY }}
        CLICKUP_LIST_ID: ${{ secrets.CLICKUP_LIST_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        RUN_MODE: full
      run: python3 agent.py

    - name: Run agent (alerts-only)
      if: steps.mode.outputs.MODE == 'alerts-only'
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
        ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        CLICKUP_API_KEY: ${{ secrets.CLICKUP_API_KEY }}
        CLICKUP_LIST_ID: ${{ secrets.CLICKUP_LIST_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        RUN_MODE: alerts-only
      run: python3 agent.py

    - name: Run agent (research)
      if: steps.mode.outputs.MODE == 'research'
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
        ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        CLICKUP_API_KEY: ${{ secrets.CLICKUP_API_KEY }}
        CLICKUP_LIST_ID: ${{ secrets.CLICKUP_LIST_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        RUN_MODE: research
      run: python3 agent.py

    - name: Commit results
      if: always()
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        # Ensure research directory exists (created by agent at runtime)
        mkdir -p docs/research/tickers docs/research/facts
        # Stage all outputs including new/untracked files
        git add -f REPORTS/ HISTORY/ docs/ logs/ 2>/dev/null || true
        # Stage research data explicitly
        git add -f docs/research/state.json docs/research/tickers/ docs/research/facts/ 2>/dev/null || true
        git add -f docs/youtube_reviewed.json docs/youtube_watchlist.json 2>/dev/null || true
        # Stage any other new files in docs/
        git add -f docs/ 2>/dev/null || true
        # Only commit if there are changes
        if ! git diff --staged --quiet; then
          git commit -m "Agent ${{ steps.mode.outputs.MODE }}: $(TZ='US/Eastern' date '+%Y-%m-%d %H:%M ET')"
          git pull --rebase origin main 2>/dev/null || true
          git push origin main || echo "Push failed -- will retry next run"
        else
          echo "No changes to commit"
        fi
