name: Trading Agent Scheduler

on:
  schedule:
    # 3 FULL REPORTS PER DAY (cron is UTC)
    # Post-market: 4:30 PM ET = 20:30 UTC (EDT)
    - cron: '0 12 * * 1-5'    # 8:00 AM EDT — Pre-market full report
    - cron: '30 16 * * 1-5'   # 12:30 PM EDT — Mid-day full report
    - cron: '30 20 * * 1-5'   # 4:30 PM EDT — Post-market full report

    # MARKET-HOURS RUNS (every 60 min) - Alerts only
    - cron: '0 14 * * 1-5'    # 10:00 AM EDT
    - cron: '0 15 * * 1-5'    # 11:00 AM EDT
    - cron: '0 16 * * 1-5'    # 12:00 PM EDT
    - cron: '0 17 * * 1-5'    # 1:00 PM EDT
    - cron: '0 18 * * 1-5'    # 2:00 PM EDT
    - cron: '0 19 * * 1-5'    # 3:00 PM EDT
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Run mode: auto (time-based), full (always report), alerts-only (no report)'
        required: false
        default: 'full'
        type: choice
        options:
          - auto
          - full
          - alerts-only

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT_TOKEN }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install -r requirements.txt

    - name: Determine run mode
      id: mode
      run: |
        # If manually triggered with a specific mode, use that
        MANUAL_MODE="${{ github.event.inputs.run_mode }}"
        if [ "$MANUAL_MODE" = "full" ]; then
          echo "MODE=full" >> $GITHUB_OUTPUT
          echo "Manual trigger: full mode"
          exit 0
        elif [ "$MANUAL_MODE" = "alerts-only" ]; then
          echo "MODE=alerts-only" >> $GITHUB_OUTPUT
          echo "Manual trigger: alerts-only mode"
          exit 0
        fi
        
        # Auto-detect based on Eastern Time
        HOUR=$(TZ='US/Eastern' date +%H)
        MIN=$(TZ='US/Eastern' date +%M)
        DOW=$(TZ='US/Eastern' date +%u)
        
        # Skip weekends
        if [ "$DOW" -gt 5 ]; then
          echo "MODE=skip" >> $GITHUB_OUTPUT
          echo "Weekend — skipping"
          exit 0
        fi
        
        # Full report at scheduled times (with 5-min window)
        if ([ "$HOUR" -eq 8 ] && [ "$MIN" -le 5 ]) || \
           ([ "$HOUR" -eq 12 ] && [ "$MIN" -ge 25 ] && [ "$MIN" -le 35 ]) || \
           ([ "$HOUR" -eq 16 ] && [ "$MIN" -ge 25 ] && [ "$MIN" -le 35 ]); then
          echo "MODE=full" >> $GITHUB_OUTPUT
          echo "Scheduled full report time"
        # Post-market hours (4 PM - 10 PM ET) always generate a full report
        elif [ "$HOUR" -ge 16 ] && [ "$HOUR" -lt 22 ]; then
          echo "MODE=full" >> $GITHUB_OUTPUT
          echo "Post-market hours — full report"
        else
          echo "MODE=alerts-only" >> $GITHUB_OUTPUT
          echo "Market hours — alerts only"
        fi

    - name: Run agent (full - report + trade + alerts)
      if: steps.mode.outputs.MODE == 'full'
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
        ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        CLICKUP_API_KEY: ${{ secrets.CLICKUP_API_KEY }}
        CLICKUP_LIST_ID: ${{ secrets.CLICKUP_LIST_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        RUN_MODE: full
      run: python3 agent.py

    - name: Run agent (alerts-only - trade + alerts, no report)
      if: steps.mode.outputs.MODE == 'alerts-only'
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
        ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        CLICKUP_API_KEY: ${{ secrets.CLICKUP_API_KEY }}
        CLICKUP_LIST_ID: ${{ secrets.CLICKUP_LIST_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        RUN_MODE: alerts-only
      run: python3 agent.py

    - name: Commit reports (full mode only)
      if: steps.mode.outputs.MODE == 'full'
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add -f REPORTS/ HISTORY/ docs/
        git add -f logs/agent.log logs/paper_trades.log 2>/dev/null || true
        git diff --staged --quiet || git commit -m "Agent report: $(TZ='US/Eastern' date '+%Y-%m-%d %H:%M ET')"
        git push
