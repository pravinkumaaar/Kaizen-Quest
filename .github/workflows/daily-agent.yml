name: Daily Agent Run

on:
  schedule:
    # Run 6 times per day on weekdays (every 2 hours from 9:30 AM to 7:30 PM ET)
    - cron: '30 9 * * 1-5'
    - cron: '30 11 * * 1-5'
    - cron: '30 13 * * 1-5'
    - cron: '30 15 * * 1-5'
    - cron: '30 17 * * 1-5'
    - cron: '30 19 * * 1-5'
  workflow_dispatch:  # Allow manual triggers

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allow the workflow to write to the repository
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # Using PAT_TOKEN (Personal Access Token) for push access
        # You created this at: https://github.com/settings/tokens with "repo" scope
        token: ${{ secrets.PAT_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Run agent
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
        ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        CLICKUP_API_KEY: ${{ secrets.CLICKUP_API_KEY }}
        CLICKUP_LIST_ID: ${{ secrets.CLICKUP_LIST_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      run: python3 agent.py
    
    - name: Commit and push reports
      run: |
        git config user.name "Kaizen Quest Agent"
        git config user.email "agent@kaizen-quest.local"
        git add REPORTS/ docs/ logs/agent.log cache/
        # Only commit if there are actual changes
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Daily agent run: $(date +%Y-%m-%d-%H%M)"
          git push
        fi
